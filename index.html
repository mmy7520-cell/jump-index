<style>
/* Layout: 一覧(検索+作品リスト) ⇄ 作品ページ(10話タブ+話リスト)。1カラムで最大 44rem、スマホは全幅 */
:root {
  --paper: #fbfaf7; --ink: #1d1c1a; --sub: #6d6a63; --line: #e4e1da;
  --accent: #d8430f; --chip: #f1eee7; --done: #2f7a4f;
  --display: "Dela Gothic One", "Hiragino Sans", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #161513; --ink: #ecebe7; --sub: #9b978e; --line: #2d2b27;
  --accent: #ff7a45; --chip: #23211e; --done: #6cc896; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #161513; --ink: #ecebe7; --sub: #9b978e; --line: #2d2b27;
  --accent: #ff7a45; --chip: #23211e; --done: #6cc896; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body); }
.wrap { max-width: 44rem; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
h1 { font: 1.6rem/1.2 var(--display); margin: 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
.meta { color: var(--sub); font-size: .85rem; margin: .4rem 0 1rem; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mode { display: flex; gap: 0; margin-bottom: .8rem; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mode button { flex: 1; min-width: 0; padding: .55rem .4rem; border: 0; background: var(--chip); font-size: .8rem; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }
#q { width: 100%; box-sizing: border-box; padding: .7rem .9rem; border: 1px solid var(--line);
  border-radius: 10px; background: var(--chip); font-size: 16px; }
.list { list-style: none; margin: 1rem 0 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: .8rem; width: 100%; padding: .85rem .2rem;
  background: none; border: 0; text-align: left; cursor: pointer; }
.row:hover .name { color: var(--accent); }
.name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.count { color: var(--sub); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { width: 3.2rem; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; flex: none; }
.bar i { display: block; height: 100%; background: var(--done); }
h2 { font: 1rem var(--display); margin: 2rem 0 0; color: var(--sub); }

.back { background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; font-weight: 700; margin-bottom: .8rem; }
.tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0; }
.tab { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: .3rem .8rem;
  font-size: .85rem; cursor: pointer; font-variant-numeric: tabular-nums; }
.tab[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab.full { box-shadow: inset 0 -3px 0 var(--done); }
.eps { list-style: none; padding: 0; margin: 0; }
.ep { display: grid; grid-template-columns: 3.4rem 1fr auto; align-items: center; gap: .6rem;
  padding: .75rem 0; border-top: 1px solid var(--line); }
.no { font: .95rem var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.ep a { color: inherit; text-decoration: none; min-width: 0; display: block; padding: .2rem 0; }
.ep a b { display: block; }
.ep a span { color: var(--sub); font-size: .8rem; }
.ep.read .no, .ep.read a { opacity: .45; }
.chk { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--line); background: none; cursor: pointer; padding: 0; }
.ep.read .chk { background: var(--done); border-color: var(--done); }
.cont { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .6rem; padding: .9rem 1rem; border-radius: 12px;
  background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; margin-top: 1rem; }
.cont span { font-weight: 400; font-size: .85rem; opacity: .9; }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.2rem; }
.pager button { flex: 1; padding: .8rem; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); cursor: pointer; font-weight: 700; }
.pager button:disabled { opacity: .35; cursor: default; }
.note { color: var(--sub); font-size: .8rem; margin-top: 2rem; }
</style>

  ? `https://shonenjumpplus.com/app/magazine/${D.issues[i][0]}`
  : `https://shonenjumpplus.com/magazine/${D.issues[i][0]}#mainPage-${p}`;
function store0(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
const store = { get(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let read = new Set(store.get("read", []));
const key = (name, i) => name + "|" + D.issues[i][0];
const all = new Map([...D.main, ...D.other]);
let cur = null, page = 0;

$("period").textContent = D.issues.length
  ? `${D.issues[0][1]} 〜 ${D.issues[D.issues.length - 1][1]}（${D.issues.length}号）・連載 ${D.main.length} 作品` : "";

function rowHTML([name, eps]) {
  const n = eps.filter(([i]) => read.has(key(name, i))).length;
  return `<li><button class="row" data-name="${esc(name)}"><span class="name">${esc(name)}</span>
    <span class="bar"><i style="width:${n / eps.length * 100}%"></i></span>
    <span class="count">${n ? n + " / " : ""}${eps.length}回</span></button></li>`;
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function renderHome() {
  const q = $("q").value.trim().toLowerCase();
  const f = list => list.filter(([n]) => !q || n.toLowerCase().includes(q)).map(rowHTML).join("");
  $("main").innerHTML = f(D.main); $("other").innerHTML = f(D.other);
}
function open(name, p) {
  cur = name; const eps = all.get(name);
  // 前回見ていた10話、なければ最初の未読を含む10話
  const firstUnread = eps.findIndex(([i]) => !read.has(key(name, i)));
  page = p != null ? p : store.get("page:" + name, Math.max(0, Math.floor(Math.max(firstUnread, 0) / C)));
  $("home").hidden = true; $("detail").hidden = false;
  $("title").textContent = name;
  $("dmeta").textContent = `${eps.length}回掲載・${D.issues[eps[0][0]][1]} 〜 ${D.issues[eps[eps.length - 1][0]][1]}`;
  store.set("last", name); renderDetail(); scrollTo(0, 0);
}
function renderDetail() {
  const eps = all.get(cur), pages = Math.ceil(eps.length / C);
  page = Math.min(page, pages - 1); store.set("page:" + cur, page);
  $("tabs").innerHTML = Array.from({ length: pages }, (_, k) => {
    const s = eps.slice(k * C, k * C + C), full = s.every(([i]) => read.has(key(cur, i)));
    return `<button class="tab${full ? " full" : ""}" data-p="${k}" aria-current="${k === page}">${k * C + 1}–${k * C + s.length}</button>`;
  }).join("");
  $("eps").innerHTML = eps.slice(page * C, page * C + C).map(([i, p], j) => {
    const r = read.has(key(cur, i));
    return `<li class="ep${r ? " read" : ""}"><span class="no">No.${page * C + j + 1}</span>
      <a href="${url(i, p)}" data-i="${i}"><b>${esc(D.issues[i][1])}</b><span>p.${p} から${mode === "app" ? "（アプリでは号の先頭から開く場合あり）" : ""}</span></a>
      <button class="chk" data-i="${i}" aria-label="読んだ印を切り替え" aria-pressed="${r}"></button></li>`;
  }).join("");
  const nu = eps.findIndex(([i]) => !read.has(key(cur, i)));
  $("cont").hidden = nu < 0;
  if (nu >= 0) { $("cont").href = url(eps[nu][0], eps[nu][1]); $("cont").dataset.i = eps[nu][0];
    $("cont").innerHTML = `▶ 続きを読む <b>No.${nu + 1}</b><span>${esc(D.issues[eps[nu][0]][1])}</span>`; }
  $("prev").disabled = page === 0; $("next").disabled = page >= pages - 1;
}
function toggle(i, on) {
  const k = key(cur, i); (on != null ? on : !read.has(k)) ? read.add(k) : read.delete(k);
  store.set("read", [...read]); renderDetail();
}

$("q").addEventListener("input", renderHome);
document.addEventListener("click", e => {
  const row = e.target.closest(".row"); if (row) return open(row.dataset.name);
  const tab = e.target.closest(".tab"); if (tab) { page = +tab.dataset.p; return renderDetail(); }
  const chk = e.target.closest(".chk"); if (chk) return toggle(+chk.dataset.i);
  const a = e.target.closest(".ep a, #cont"); if (a) { read.add(key(cur, +a.dataset.i)); store.set("read", [...read]); }
});
$("back").onclick = () => { store.set("last", null); $("detail").hidden = true; $("home").hidden = false; renderHome(); };
$("prev").onclick = () => { page--; renderDetail(); scrollTo(0, 0); };
$("next").onclick = () => { page++; renderDetail(); scrollTo(0, 0); };

window.addEventListener("pageshow", e => { if (e.persisted && cur) { read = new Set(store.get("read", [])); renderDetail(); } });
